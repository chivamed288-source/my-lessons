<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16233b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Cours - My Lessons</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <main class="wrap">
    <a id="back" class="back" href="index.html">Retour</a>
    <h1 id="title"></h1>
    <div id="bar"></div>
    <div id="content"></div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      const lid = params.get("l"), sid = params.get("s"), mid = params.get("m");
      document.getElementById("back").href = "niveau.html?l=" + lid;
      document.getElementById("back").textContent = "Matières " + (lid || "");
      try {
        const data = await loadData();
        const level = data.levels.find(l => l.id === lid);
        const sem = level && level.semesters.find(s => s.id === sid);
        const sub = sem && sem.subjects.find(m => m.id === mid);
        if (!sub) return showError("Matière introuvable. Retourne à l'accueil.");
        document.getElementById("title").textContent = sub.name;
        document.title = sub.name + " - My Lessons";

        const content = document.getElementById("content");
        if (!sub.lessons.length) {
          content.append(el("p", { class: "empty" }, "Aucun fichier pour cette matière. Demande au chef de classe de les ajouter."));
          return;
        }

        const rows = []; // { ls, open, off }
        function setSaved(r, saved) {
          r.off.dataset.saved = saved ? "1" : "0";
          r.open.dataset.saved = saved ? "1" : "0";
          r.off.textContent = saved ? "✓ Hors ligne" : "Hors ligne";
        }

        TYPES.forEach(([key, label]) => {
          const items = sub.lessons.filter(l => l.type === key);
          if (!items.length) return;
          content.append(el("h2", {}, label));
          const ul = el("ul", { class: "list" });
          items.forEach(ls => {
            const title = el("span", {}, ls.title);
            if (isNew(ls.added)) title.append(el("span", { class: "new" }, "Nouveau"));
            const open = el("a", { class: "btn primary", href: pdfHref(ls.file), target: "_blank", rel: "noopener" }, "Ouvrir");
            const off = el("button", { class: "btn", type: "button" }, "Hors ligne");
            const r = { ls, open, off };
            rows.push(r);

            open.addEventListener("click", e => {
              if (!navigator.onLine && open.dataset.saved !== "1") {
                e.preventDefault();
                alert("Ce fichier n'est pas enregistré hors ligne. Connecte-toi à internet pour l'ouvrir, ou enregistre-le avant avec le bouton « Hors ligne ».");
              }
            });
            off.addEventListener("click", async () => {
              if (off.dataset.saved === "1") { await removePdf(ls.file); return setSaved(r, false); }
              off.textContent = "…";
              try { await savePdf(ls.file); setSaved(r, true); }
              catch (e) { setSaved(r, false); alert("Impossible d'enregistrer ce fichier. Vérifie ta connexion et réessaie."); }
            });

            ul.append(el("li", { class: "row" }, title, el("span", { class: "actions" }, open, off)));
          });
          content.append(ul);
        });

        // Bouton "tout enregistrer"
        const all = el("button", { class: "btn primary", type: "button" }, "Tout enregistrer hors ligne");
        const hint = el("span", { class: "hint" }, "Pour lire sans internet");
        document.getElementById("bar").append(el("div", { class: "offline-bar" }, all, hint));
        all.addEventListener("click", async () => {
          const todo = rows.filter(r => r.off.dataset.saved !== "1");
          if (!todo.length) { hint.textContent = "Tout est déjà enregistré"; return; }
          all.disabled = true;
          let done = 0, failed = 0;
          for (const r of todo) {
            hint.textContent = "Enregistrement " + (done + failed + 1) + "/" + todo.length + "...";
            try { await savePdf(r.ls.file); setSaved(r, true); done++; } catch (e) { failed++; }
          }
          all.disabled = false;
          hint.textContent = failed ? done + " enregistré(s), " + failed + " échec(s). Réessaie avec internet." : "✓ Tout est enregistré";
        });

        // État initial : quels fichiers sont déjà enregistrés
        for (const r of rows) setSaved(r, await isSaved(r.ls.file));
      } catch (e) { showError("Erreur de chargement. Vérifie ta connexion et réessaie."); }
    })();
  </script>
</body>
</html>
