<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Lessons - Tous les cours au même endroit</title>
  <meta name="theme-color" content="#16233b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <main class="wrap">
    <h1>Tous tes cours, <span>au même endroit.</span></h1>
    <p class="lead">Choisis ton niveau pour retrouver les cours, TD, TP et examens de chaque matière.</p>

    <a id="resume" class="resume" href="#"></a>

    <nav class="levels" aria-label="Choix du niveau">
      <a class="level" href="niveau.html?l=L1" data-level="L1"><b>L1</b><span>Licence 1<small>Semestres 1 et 2</small></span></a>
      <a class="level" href="niveau.html?l=L2" data-level="L2"><b>L2</b><span>Licence 2<small>Semestres 3 et 4</small></span></a>
      <a class="level" href="niveau.html?l=L3" data-level="L3"><b>L3</b><span>Licence 3<small>Semestres 5 et 6</small></span></a>
    </nav>

    <footer>Un fichier manque ? Dis-le au chef de ta classe.</footer>
  </main>

  <script>
    // Se souvenir du dernier niveau choisi
    const KEY = "ml_level";
    try {
      document.querySelectorAll(".level").forEach(a =>
        a.addEventListener("click", () => localStorage.setItem(KEY, a.dataset.level)));
      const last = localStorage.getItem(KEY);
      if (last) {
        const r = document.getElementById("resume");
        r.href = "niveau.html?l=" + last;
        r.textContent = "Continuer avec " + last;
        r.classList.add("show");
      }
    } catch (e) { /* stockage indisponible : on ignore */ }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
