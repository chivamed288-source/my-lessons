<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Lessons - Tous les cours au même endroit</title>
  <meta name="theme-color" content="#16233b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script>
    // Niveau déjà choisi : on saute cette page (sauf si l'élève veut changer : ?choose=1)
    (function () {
      try {
        var l = localStorage.getItem("ml_level");
        if (l && !new URLSearchParams(location.search).has("choose")) {
          location.replace("niveau.html?l=" + encodeURIComponent(l));
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <h1>Tous tes cours, <span>au même endroit.</span></h1>
    <p class="lead">Choisis ton niveau pour retrouver les cours, TD, TP et examens de chaque matière. Tu ne le feras qu'une seule fois.</p>

    <nav class="levels" aria-label="Choix du niveau">
      <a class="level" href="niveau.html?l=L1" data-level="L1"><b>L1</b><span>Licence 1<small>Semestres 1 et 2</small></span></a>
      <a class="level" href="niveau.html?l=L2" data-level="L2"><b>L2</b><span>Licence 2<small>Semestres 3 et 4</small></span></a>
      <a class="level" href="niveau.html?l=L3" data-level="L3"><b>L3</b><span>Licence 3<small>Semestres 5 et 6</small></span></a>
    </nav>

    <footer>Un fichier manque ? Dis-le au chef de ta classe.</footer>
  </main>

  <script>
    document.querySelectorAll(".level").forEach(function (a) {
      a.addEventListener("click", function () {
        try { localStorage.setItem("ml_level", a.dataset.level); } catch (e) {}
      });
    });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  </script>
</body>
</html>
